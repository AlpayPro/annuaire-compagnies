<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire AS Du Grand Lyon</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #F5F7FA;
      margin: 0;
    }

    .header {
      background: #6d3a5e;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
    }

    .logo-header {
      height: 50px;
    }

    .title {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .container {
      padding: 30px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 250px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #b35d99;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    th {
      background: #b35d99;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      vertical-align: middle;
    }

    tr:hover {
      background: #f1f5f9;
      transition: 0.2s;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .btn-link {
      background: #2EA44F;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      display: inline-block;
    }

    .badge {
      display: inline-block;
      background: #e3ecf7;
      color: #0A2540;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin: 2px;
      font-weight: 500;
    }

    #loader {
      text-align: center;
      padding: 20px;
      font-weight: bold;
      color: #6d3a5e;
    }

    @media (max-width: 768px) {
      table { font-size: 12px; }
      input, select { width: 100%; }
      .header { flex-direction: column; text-align: center; gap: 10px; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<header class="header">
  <!-- CORRECTION ICI : Pas de chemin local, juste le nom du fichier -->
  <img src="logos/as-logo.png" class="logo-header" alt="Logo">
  <div class="title">Annuaire Partenaires - AS Du Grand Lyon</div>
</header>

<div class="container">
  <div id="infoBar" style="margin-bottom:10px; font-size:14px;"></div>
  <div id="loader">Chargement des données...</div>

  <div class="controls">
    <input type="text" id="search" placeholder="Rechercher une compagnie ou produit...">
    <select id="filterProduit">
      <option value="">Tous les produits</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th data-col="COMPAGNIES">NOM ⬍</th>
        <th data-col="PRODUITS">PRODUITS ⬍</th>
        <th data-col="LIENS">LIEN ⬍</th>
        <th data-col="CONTACT INSPECTEUR">CONTACT ⬍</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script src="script.js"></script>

</body>
</html>
